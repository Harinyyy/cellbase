services:
  mongodb:
    image: mongo:7
    container_name: cellculture-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodbdata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: cellculture-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # No volume attached: Redis is used only for caching/sessions in this MVP.

volumes:
  mongodbdata:
